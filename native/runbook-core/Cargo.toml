[package]
name = "runbook-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
pulldown-cmark = "0.13"
ts-rs = { version = "11", features = ["serde-compat"] }

[[bin]]
name = "export-types"
path = "src/bin/export_types.rs"
