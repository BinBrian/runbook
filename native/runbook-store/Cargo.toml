[package]
name = "runbook-store"
version = "0.1.0"
edition = "2021"

[dependencies]
runbook-core = { path = "../runbook-core" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", features = ["serde-compat"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "export-store-types"
path = "src/bin/export_store_types.rs"
