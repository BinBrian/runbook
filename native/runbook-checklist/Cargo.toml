[package]
name = "runbook-checklist"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
